[package]
name = "pathos"
description = "A DAW (digital audio workstation) built with gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gpui = "0.2.2"
pathos-agent = { path = "crates/pathos-agent", version = "0.1.0" }
pathos-core = { path = "crates/pathos-core", version = "0.1.0" }
pathos-playback = { path = "crates/pathos-playback", version = "0.1.0" }
pathos-render = { path = "crates/pathos-render", version = "0.1.0" }

[dev-dependencies]
# tests/architecture.rs reads the modules of the app and the crate graph.
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true

[workspace]
members = [
    "crates/pathos-agent",
    "crates/pathos-core",
    "crates/pathos-measure",
    "crates/pathos-playback",
    "crates/pathos-reaper",
    "crates/pathos-render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/chansuke/pathos"

# Each crate takes these with `[lints] workspace = true`. clippy.toml lists the
# methods that are banned and what to call instead.
[workspace.lints.rust]
# Kani sets `cfg(kani)` when it builds the proof harnesses (ADR 11), and the
# loom tests build with `--cfg loom` (ADR 18).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(loom)"] }

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

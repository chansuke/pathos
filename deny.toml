[graph]
all-features = true

[advisories]
# gpui pulls in crates flagged as unmaintained that pathos cannot replace.
# Report unmaintained crates only when pathos depends on them directly.
unmaintained = "workspace"
ignore = []

[licenses]
# Licenses compatible with distributing pathos under MIT. MPL-2.0 is copyleft
# only at the file level, so it does not extend to pathos's own code.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Only the app draws a window, and only playback opens an audio device, so the
# other crates build and test without either.
deny = [
    { crate = "gpui", wrappers = ["pathos"], reason = "only the app draws with gpui: put window code in src/, and keep the crates plain Rust" },
    { crate = "cpal", wrappers = ["pathos-playback"], reason = "only pathos-playback opens an audio device (ADR 18): render offline with pathos-render, or play through pathos-playback" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

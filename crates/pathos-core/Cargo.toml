[package]
name = "pathos-core"
description = "The project model of pathos, specified by the Lean model in spec/"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
proptest = "1"

[lints.rust]
# Kani sets `cfg(kani)` when it builds the proof harnesses (ADR 11).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

version: 2
updates:
  # Cargo is left out: Cargo.lock pins libc for gpui (see README.md), and
  # cargo-deny reports advisories.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before taking a new release, so a compromised one is likely to be
    # found and pulled first.
    cooldown:
      default-days: 7

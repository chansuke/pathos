name: ADR

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check ADRs
        run: nix shell --inputs-from . nixpkgs#adrs -c adrs doctor
      - name: Check that the ADR index is up to date
        run: nix shell --inputs-from . nixpkgs#adrs -c adrs generate toc | diff - docs/adr/README.md

name: Mutants

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Run cargo and rustc from the dev shell, not the runner's rustup.
          cmd-format: nix develop -c {0}
          save-if: false
      - name: Build the Lean model
        run: nix develop -c lake -d spec build
      # A pull request mutates only the lines it changes, in the core, the
      # agent interface, the editor, the measurements and the render; the
      # schedule mutates the core, the agent interface and the editor in full
      # (ADR 13).
      - name: Select the mutants
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf '%s\n' core agent editor > "$RUNNER_TEMP/packages.txt"
            exit 0
          fi
          : > "$RUNNER_TEMP/packages.txt"
          while read -r name paths; do
            # shellcheck disable=SC2086 # one argument per path
            git diff "$BASE_SHA...HEAD" -- $paths > "$RUNNER_TEMP/$name.diff"
            [ -s "$RUNNER_TEMP/$name.diff" ] && echo "$name" >> "$RUNNER_TEMP/packages.txt"
          done <<'LIST'
          core crates/pathos-core
          agent crates/pathos-agent
          editor src/editor.rs
          measure crates/pathos-measure
          render crates/pathos-render
          LIST
          cat "$RUNNER_TEMP/packages.txt"
      - name: Check that the tests catch each mutant
        env:
          EVENT: ${{ github.event_name }}
          PATHOS_MODEL: ${{ github.workspace }}/spec/.lake/build/bin/pathos-model
        run: |
          status=0
          while read -r name; do
            args=()
            case $name in
              core) package=pathos-core ;;
              agent) package=pathos-agent ;;
              editor)
                package=pathos
                args=(-f src/editor.rs)
                ;;
              measure) package=pathos-measure ;;
              render) package=pathos-render ;;
            esac
            [ "$EVENT" = pull_request ] && args+=(--in-diff "$RUNNER_TEMP/$name.diff")
            nix develop -c cargo mutants -p "$package" --test-package "$package" \
              -o "$RUNNER_TEMP/$name" "${args[@]}" || status=1
          done < "$RUNNER_TEMP/packages.txt"
          exit "$status"
      - name: Report the mutants the tests missed
        if: ${{ !cancelled() }}
        run: |
          echo "### Mutants" >> "$GITHUB_STEP_SUMMARY"
          for out in "$RUNNER_TEMP"/*/mutants.out; do
            [ -d "$out" ] || continue
            name=$(basename "$(dirname "$out")")
            {
              echo "#### $name"
              echo "Caught $(wc -l < "$out/caught.txt"), missed $(wc -l < "$out/missed.txt"), timed out $(wc -l < "$out/timeout.txt"), unviable $(wc -l < "$out/unviable.txt")."
              if [ -s "$out/missed.txt" ]; then
                echo '```'
                cat "$out/missed.txt"
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done

name: Spec

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Run cargo and rustc from the dev shell, not the runner's rustup.
          cmd-format: nix develop -c {0}
          # Pull requests restore the cache that main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Lean model
        run: nix develop -c lake -d spec build
      - name: Report unfinished proofs
        run: |
          count=$(grep -rw sorry spec --include='*.lean' | wc -l || true)
          echo "Unfinished proofs (\`sorry\`): $count" >> "$GITHUB_STEP_SUMMARY"
      - name: Audit theorems, axioms and definitions
        run: |
          mkdir "$RUNNER_TEMP/audit"
          nix develop -c sh -c 'cd spec && lake env lean --run Audit.lean "$0"' "$RUNNER_TEMP/audit" \
            2> "$RUNNER_TEMP/audit.txt" || { cat "$RUNNER_TEMP/audit.txt"; exit 1; }
          grep -E '^[0-9]+ theorems' "$RUNNER_TEMP/audit.txt" >> "$GITHUB_STEP_SUMMARY"
          stale=0
          for list in theorems.txt definitions.txt; do
            if ! diff -u "spec/$list" "$RUNNER_TEMP/audit/$list"; then
              echo "::error file=spec/$list::Out of date. Regenerate it with: cd spec && lake env lean --run Audit.lean"
              stale=1
            fi
          done
          exit "$stale"
      - name: Check that no theorem is removed or loses its proof
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:spec/theorems.txt" > "$RUNNER_TEMP/base.txt"
          names() { cut -d' ' -f1 "$1" | sort; }
          # Each line is `name [status] : statement`.
          statements() { sed -E 's/^([^ ]+) \[[a-z]+\] :/\1 :/' "$1" | sort; }
          with_status() { awk -v status="[$2]" '$2 == status { print $1 }' "$1" | sort; }
          restated=$(comm -13 <(statements "$RUNNER_TEMP/base.txt") <(statements spec/theorems.txt) \
            | cut -d' ' -f1 | sort | comm -12 - <(names "$RUNNER_TEMP/base.txt"))
          for name in $restated; do
            echo "::warning file=spec/theorems.txt::$name is restated; its new statement needs human review"
          done
          removed=$(comm -23 <(names "$RUNNER_TEMP/base.txt") <(names spec/theorems.txt))
          for name in $removed; do
            echo "::error file=spec/theorems.txt::$name is removed; keep it, with sorry if its proof is hard"
          done
          unproved=$(comm -12 <(with_status "$RUNNER_TEMP/base.txt" proved) \
            <(with_status spec/theorems.txt unfinished))
          for name in $unproved; do
            echo "::error file=spec/theorems.txt::$name was proved and is now unfinished; restore its proof"
          done
          [ -z "$removed" ] && [ -z "$unproved" ]
      - name: Report definitions that need human review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          if ! git show "$BASE_SHA:spec/definitions.txt" > "$RUNNER_TEMP/base-definitions.txt" 2>/dev/null; then
            echo "The base commit has no spec/definitions.txt; nothing to compare."
            exit 0
          fi
          # Each line is `name [kind] fingerprint`.
          changed=$(diff "$RUNNER_TEMP/base-definitions.txt" spec/definitions.txt \
            | sed -nE 's/^[<>] ([^ ]+) .*/\1/p' | sort -u)
          [ -z "$changed" ] && exit 0
          echo "### Definitions changed, added or removed" >> "$GITHUB_STEP_SUMMARY"
          for name in $changed; do
            echo "::warning file=spec/definitions.txt::$name changed; the model's definitions need human review"
            echo "- \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Check the Rust core against the model
        run: nix develop -c cargo test -p pathos-core
        env:
          PROPTEST_CASES: 10000
      - name: Report how often the generators reach each rule
        run: |
          echo "### Generator coverage" >> "$GITHUB_STEP_SUMMARY"
          nix develop -c cargo test -q -p pathos-core --test differential generators_reach_every_rule -- --nocapture \
            | grep '^|' >> "$GITHUB_STEP_SUMMARY"

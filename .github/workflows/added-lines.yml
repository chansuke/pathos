name: Added lines

# Reads only the lines a pull request adds or replaces, so existing code never
# fails it.
on:
  pull_request:

permissions:
  contents: read

jobs:
  added-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the check
        run: scripts/test-check-escape-hatches.sh
      # A pull request's merge commit has the base branch as its first parent.
      - name: Check the lines the pull request adds
        run: scripts/check-escape-hatches.sh HEAD^1 HEAD

name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Run cargo and rustc from the dev shell, not the runner's rustup.
          cmd-format: nix develop -c {0}
          # Pull requests restore the cache that main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint and test
        run: |
          nix develop -c bash -euo pipefail -c '
            echo "::group::Check formatting"
            cargo fmt --all --check
            echo "::endgroup::"

            echo "::group::Run clippy"
            cargo clippy --locked --workspace --all-targets -- -D warnings
            echo "::endgroup::"

            echo "::group::Check licenses, advisories and sources"
            cargo deny check
            echo "::endgroup::"

            # Every crate except pathos-core (which runs against the Lean model
            # in the Spec workflow); the REAPER comparison is ignored (ADR 34).
            echo "::group::Test workspace crates"
            cargo test --locked --workspace --exclude pathos-core
            echo "::endgroup::"

            # The loom tests run every interleaving of the snapshot hand-off
            # within their bound and check the invariants of
            # tla/SnapshotHandoff.tla (ADR 18).
            echo "::group::Test playback hand-off under loom"
            RUSTFLAGS="${RUSTFLAGS:-} --cfg loom" cargo test --locked -p pathos-playback --release --target-dir target/loom
            echo "::endgroup::"
          '

  # The render needs no model, so its tests run here rather than with the
  # differential tests. Its hash test fails if a render depends on the platform
  # (ADR 15), so it runs on each architecture and OS that the flake supports.
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop -c {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the render
        run: nix develop -c cargo test --locked -p pathos-render

  # Checks that the flake's default package builds (Cargo build flags, runtime
  # wrappers, and bundled assets).
  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build the Nix package
        run: nix build .#default --no-link

name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Run cargo and rustc from the dev shell, not the runner's rustup.
          cmd-format: nix develop -c {0}
          # Pull requests restore the cache that main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: nix develop -c cargo fmt --all --check
      - name: Run clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Check licenses, advisories and sources
        run: nix develop -c cargo deny check
      # The editor and the layout are plain Rust, so their tests need no window.
      - name: Test the app
        run: nix develop -c cargo test -p pathos
      # The comparison with REAPER itself is ignored here until a license
      # for CI is settled (ADR 7, ADR 33); the conversion needs no REAPER.
      - name: Test the conversion to REAPER projects
        run: nix develop -c cargo test -p pathos-reaper
      # The loom tests run every interleaving of the snapshot hand-off within
      # their bound and check the invariants of tla/SnapshotHandoff.tla
      # (ADR 18).
      - name: Test the playback hand-off
        run: |
          nix develop -c cargo test -p pathos-playback
          nix develop -c sh -c 'RUSTFLAGS="$RUSTFLAGS --cfg loom" cargo test -p pathos-playback --release --target-dir target/loom'

  # The render needs no model, so its tests run here rather than with the
  # differential tests. Its hash test fails if a render depends on the platform
  # (ADR 15), so it runs on each architecture and OS that the flake supports.
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop -c {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the render
        run: nix develop -c cargo test -p pathos-render

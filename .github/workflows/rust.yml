name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Run cargo and rustc from the dev shell, not the runner's rustup.
          cmd-format: nix develop -c {0}
          # Pull requests restore the cache that main saves.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: nix develop -c cargo fmt --all --check
      - name: Run clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings
      - name: Check licenses, advisories and sources
        run: nix develop -c cargo deny check

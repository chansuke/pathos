name: Kani

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KANI_VERSION: 0.68.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Kani is not in nixpkgs, and `cargo kani setup` installs the nightly it
      # needs with rustup, so this job uses the runner's rustup instead of the
      # Nix dev shell (ADR 11).
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      # Kani checks the harnesses one at a time, so the solver of one harness
      # has the runner's memory to itself. A harness that runs past the timeout
      # fails on its own instead of exhausting the runner.
      - name: Check the proof harnesses
        working-directory: crates/pathos-core
        run: |
          while true; do free -m | awk 'NR == 2 { print $3 }' >> "$RUNNER_TEMP/memory.txt"; sleep 10; done &
          cargo kani --output-format terse -Z unstable-options --harness-timeout 10m 2>&1 \
            | tee "$RUNNER_TEMP/kani.log"
      - name: Report each harness
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Kani"
            echo '```'
            grep -E 'Checking harness|VERIFICATION|cover properties|Verification Time|Complete|Failed' "$RUNNER_TEMP/kani.log" || true
            echo '```'
            echo "Peak memory in use: $(sort -n "$RUNNER_TEMP/memory.txt" | tail -1) MiB"
          } >> "$GITHUB_STEP_SUMMARY"
      # Kani passes a harness whose cover properties are unsatisfiable or
      # unreachable. Such a harness checks nothing, so fail it here.
      - name: Check that every harness satisfies its cover properties
        if: ${{ !cancelled() }}
        run: |
          awk '
            /^Checking harness / { harness = $3; sub(/\.\.\.$/, "", harness); covered[harness] = 0 }
            /\*\* [0-9]+ of [0-9]+ cover properties satisfied/ {
              for (i = 1; i <= NF; i++) if ($i == "of") { satisfied = $(i - 1); total = $(i + 1) }
              covered[harness] = 1
              if (satisfied != total) {
                printf "::error::%s: %d of %d cover properties satisfied\n", harness, satisfied, total
                failed = 1
              }
            }
            END {
              for (harness in covered) if (!covered[harness]) {
                printf "::error::%s has no cover property\n", harness
                failed = 1
              }
              exit failed
            }' "$RUNNER_TEMP/kani.log"

name: Kani

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KANI_VERSION: 0.68.0

jobs:
  # Each harness runs in its own job, so that its solver has a runner to itself
  # and the slowest harnesses run side by side within the time limits (ADR 16).
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      harnesses: ${{ steps.list.outputs.harnesses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Kani is not in nixpkgs, and `cargo kani setup` installs the nightly it
      # needs with rustup, so these jobs use the runner's rustup instead of the
      # Nix dev shell (ADR 11).
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - name: List the proof harnesses
        id: list
        working-directory: crates/pathos-core
        run: |
          cargo kani list --format json
          echo "harnesses=$(jq -c '[."standard-harnesses"[][]]' kani-list.json)" >> "$GITHUB_OUTPUT"

  harness:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.list.outputs.harnesses) }}
    name: harness (${{ matrix.harness }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      # A harness that runs past the timeout fails on its own instead of
      # exhausting the runner.
      - name: Check the proof harness
        working-directory: crates/pathos-core
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          while true; do free -m | awk 'NR == 2 { print $3 }' >> "$RUNNER_TEMP/memory.txt"; sleep 10; done &
          cargo kani --output-format terse -Z unstable-options --harness-timeout 10m \
            --exact --harness "$HARNESS" 2>&1 | tee "$RUNNER_TEMP/kani.log"
      - name: Report the harness
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Kani"
            echo '```'
            grep -E 'Checking harness|VERIFICATION|cover properties|Verification Time|Complete|Failed' "$RUNNER_TEMP/kani.log" || true
            echo '```'
            echo "Peak memory in use: $(sort -n "$RUNNER_TEMP/memory.txt" | tail -1) MiB"
          } >> "$GITHUB_STEP_SUMMARY"
      # Kani passes a harness whose cover properties are unsatisfiable or
      # unreachable. Such a harness checks nothing, so fail it here.
      - name: Check that the harness satisfies its cover properties
        if: ${{ !cancelled() }}
        run: |
          awk '
            /^Checking harness / { harness = $3; sub(/\.\.\.$/, "", harness); covered[harness] = 0 }
            /\*\* [0-9]+ of [0-9]+ cover properties satisfied/ {
              for (i = 1; i <= NF; i++) if ($i == "of") { satisfied = $(i - 1); total = $(i + 1) }
              covered[harness] = 1
              if (satisfied != total) {
                printf "::error::%s: %d of %d cover properties satisfied\n", harness, satisfied, total
                failed = 1
              }
            }
            END {
              for (harness in covered) if (!covered[harness]) {
                printf "::error::%s has no cover property\n", harness
                failed = 1
              }
              exit failed
            }' "$RUNNER_TEMP/kani.log"

  # The check that a pull request requires: every harness passed.
  verify:
    needs: harness
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every harness to pass
        env:
          RESULT: ${{ needs.harness.result }}
        run: test "$RESULT" = success

name: REAPER

# CI does not run the comparison with REAPER (ADR 34), so a pull request that
# changes the core, the render or the converter states that it ran it.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  stated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the pull request states the comparison with REAPER
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          paths="crates/pathos-core crates/pathos-render crates/pathos-reaper"
          # shellcheck disable=SC2086
          if git diff --quiet "$BASE...$HEAD" -- $paths; then
            echo "The pull request does not change $paths."
          elif printf '%s\n' "$BODY" | tr -d '\r' | grep -qx 'REAPER comparison: passed'; then
            echo "The pull request states that the comparison with REAPER passed."
          else
            echo "::error::This pull request changes $paths. Run 'nix develop .#reaper -c cargo test -p pathos-reaper -- --ignored' and add the line 'REAPER comparison: passed' to its description (ADR 34)."
            exit 1
          fi

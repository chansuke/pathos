name: REAPER

# CI does not run the comparison with REAPER (ADR 34), so a pull request that
# changes the core, the render or the converter states that it ran it, with
# the key of the code it compared (scripts/reaper-key).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  stated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the key and the check of the line
        run: scripts/test-reaper-line.sh
      - name: Check that the pull request states the comparison with REAPER
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-reaper-line.sh "$BASE" "$HEAD"

# Temporary: compares solvers on the slowest harness. Remove before merging.
name: Kani solver experiment

on:
  pull_request:

permissions:
  contents: read

env:
  KANI_VERSION: 0.68.0

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        solver: [cadical, kissat, minisat, z3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - name: Install Z3
        if: matrix.solver == 'z3'
        run: sudo apt-get install -y z3
      - name: Check split_clip_of_1
        working-directory: crates/pathos-core
        env:
          SOLVER: ${{ matrix.solver }}
        run: |
          # Sample the memory in use every 10 seconds.
          while true; do free -m | awk 'NR == 2 { print $3 }' >> "$RUNNER_TEMP/memory.txt"; sleep 10; done &
          start=$(date +%s)
          status=0
          cargo kani --output-format terse -Z unstable-options --harness-timeout 15m \
            --solver "$SOLVER" --harness project::verification::split_clip_of_1 --exact || status=$?
          echo "elapsed: $(( $(date +%s) - start ))s, exit: $status"
          echo "peak memory in use: $(sort -n "$RUNNER_TEMP/memory.txt" | tail -1) MiB"
      - name: Report kernel OOM kills
        if: ${{ !cancelled() }}
        run: sudo dmesg | grep -i -E 'out of memory|oom|killed process' || echo "no OOM in dmesg"

# cargo-mutants (ADR 13).

exclude_globs = [
    # Kani harnesses build only under `cfg(kani)`, so no test can catch a
    # mutant of them; the Kani workflow checks them instead.
    "crates/pathos-core/src/project/verification.rs",
]

exclude_re = [
    # When `tick` equals the next change's tick, both branches stop at `tick`,
    # so `>=` computes the same time as `>`.
    "replace > with >= in micros_times_ppq",
    # The metronome's loop in `Score::render` reaches `end` only on a beat
    # that starts there, whose click adds nothing to the block, so `<=`
    # renders the same frames.
    "replace < with <= in Score::render",
    # A pitch below the sample rate advances less than a whole cycle each
    # frame, so `step` subtracts zero and `+` gives the same step. Every rate
    # the tests use is above the highest pitch.
    "replace - with \\+ in step",
]
